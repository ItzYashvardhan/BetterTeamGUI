# Allies List View
main:
  title: "<bold><gradient:#C45700:#FF7608>Allies List (Page - {page})</bold>"
  row: 6
  font-title: false
  font-name: false
  font-lore: true
  background:
    0:
      name: " "
      item: LIGHT_BLUE_STAINED_GLASS_PANE
      slot: [ 0,2,4,6,8,18,26,36,44,46,48,50,52 ]
      flags:
        - HIDE_ATTRIBUTES
    1:
      name: " "
      item: PURPLE_STAINED_GLASS_PANE
      slot: [ 1,3,5,7,9,17,27,35,45,47,49,51,53 ]
  slot:
    back: 52
    home: 53
    prev: 47
    next: 51

ally-item:
  name: "<b>{team_color_code}{team}{/team_color_code}</b>"
  lore:
    - ""
    - "<green>Left-Click</green> <gray>to view team</gray>"
    - "<red>Shift-Click</red> <gray>to remove ally</gray>"
  item: PLAYER_HEAD
  texture: "" # This will be dynamically set if using player head

ally-request-inbox:
  name: "<b><caps><gradient:#C40067:#EC7FB8>Ally Requests</gradient></b> ({allies_request})"
  lore:
    - "<gray>View pending ally requests</gray>"
    - " "
    - "<green>Left-Click</green> <gray>to view</gray>"
  item: CHEST
  slot: 49

ally-request-item:
  name: "<b>{team_color_code}{team}{/team_color_code}</b>"
  lore:
    - ""
    - "<green>Left-Click</green> <gray>to accept request</gray>"
    - "<green>Right-Click</green> <gray>to view team</gray>"
    - "<red>Shift-Click</red> <gray>to deny request</gray>"
  item: PLAYER_HEAD
  texture: ""


