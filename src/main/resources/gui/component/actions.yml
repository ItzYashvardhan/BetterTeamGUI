warp:
  claim:
    - "[sound] light_click"
    - "[input] warp/claim [player] {cmd.team} setwarp {input}"
  teleport:
    click:
      when:
        value: "{warp_locked}"
        result:
          "Yes":
            - "[sound] locked"
            - "[input] warp/passward [player] {cmd.team} warp {warp_name} {input}"
          else:
            - "[player] {cmd.team} warp {warp_name}"
            - "[sound] teleport" ## If you have warp tp cooldown use delay :)
            - "[close]"
    shift-click: # Delete
      - "[sound] light_click"
      - "[open] dialog/delete_warp"


  locked:
    - "[sound] locked"

