dashboard:
  list:
    - "[sound] gui.dashboard.list"
    - "[open] pager/team_list"
  allies:
    - "[sound] gui.dashboard.allies"
    - "[open] allies_view"
  leave:
    - "[sound] dashboard.leave"
    - "[open] dialog/leave"
  info:
    left-click:
      - "[sound] gui.dashboard.info"
      - "[open] leaderboard_view"
    right-click:
      - "[sound] gui.dashboard.info"
      - "[open] levels_view"
  home:
    left-click:
      - "[sound] gui.dashboard.home"
      - "[player] {cmd.team} home"

    shift-click:
      - "[sound] gui.dashboard.home"
      - "[open] dialog/delete_home"

    right-click:
      when:
        value: "{team_has_home}"
        result:
          "true":
            - "[sound] gui.dashboard.home"
            - "[open] dialog/update_home"
          "false":
            - "[sound] gui.dashboard.home"
            - "[player] {cmd.team} sethome"
            - "[back]"

  members:
    - "[sound] gui.dashboard.members"
  team_chest:
    - "[sound] gui.dashboard.team-chest"
    - "[close]"
    - "[player] {cmd.team} echest"
  warps:
    - "[sound] gui.dashboard.warps"
    - "[open] pager/warps_view"
  balance:
    - "[sound] gui.dashboard.balance"
    - "[open] money_view"
  chat_global:
    - "[sound] gui.dashboard.chat.global"
  chat_team:
    - "[sound] gui.dashboard.chat.team"
