example:
  # ====================================================
  # EXAMPLE 1: Simple
  # ====================================================
  open_menu:
    requirements:
      - "[permission] team.use"
      - "[condition] %vault_eco_balance% >= 1000"
    click:
      - "[sound] block_chest_open"
      - "[open] dashboard_view"
      - "[message] <green>Opening Team Dashboard..."
  
  # ====================================================
  # EXAMPLE 2: SEQUENCE & CONDITIONS (if / else if / else)
  # ====================================================
  claim_daily_reward:
    sequence:
      # Node 1: Checked first (Highest Priority)
      1:
        requirements:
          - "[permission] server.rank.vip"
          - "[condition] {vault_eco_balance} >= 1000" # { } gets converted to % % for PAPI
        click:
          - "[message] <green>You claimed the VIP reward!"
          - "[console] eco give %player_name% 5000"
          - "[sound] entity_player_levelup"
          - "[close]"

      # Node 2: Checked only if Node 1 requirements fail
      2:
        requirements:
          - "[group] default"
        left-click:
          - "[message] <yellow>You claimed the standard daily reward!"
          - "[console] eco give %player_name% 500"
        right-click:
          - "[message] <gray>You right-clicked to claim the standard reward!"

      # Fallback: Runs only if ALL numbered nodes fail their requirements
      else:
        click:
          - "[message] <red>You do not meet the requirements for any rewards!"
          - "[sound] entity_villager_no" # Value retrieve from component/sound.yml


  # ====================================================
  # EXAMPLE 3: WHEN (Switch/Case Statements)
  # ====================================================
  teleport_to_spawn:
    click:
      when:
        value: "{player_world}" # The engine resolves this via PlaceholderAPI
        result:
          "world_nether":
            - "[message] <red>Magic doesn't work in the Nether!"
            - "[sound] block_anvil_place"
          
          "world_the_end":
            - "[message] <red>You are trapped in the End."
          
          "default": # Runs if the value doesn't match 'world_nether' or 'world_the_end'
            - "[message] <green>Teleporting you to spawn!"
            - "[player] spawn"
            - "[close]"