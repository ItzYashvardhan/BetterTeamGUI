# ----------------------------------------------------
# Common Buttons
# ----------------------------------------------------
home:
  - "[sound] click"
  - "[open] dashboard_view"
back:
  - "[sound] click"
  - "[back]"

# ----------------------------------------------------
# Inputs
# ----------------------------------------------------
input:
  verify_team_creation:
    sequence:
      1:
        requirements:
          - "[condition] '{team}' == ''"
        click:
          - "[message] <red>That team name is invalid or already taken! Try again."
          - "[sound] block.anvil.place"
          - "[input] create-team"

      else:
        click:
          - "[message] <green>Team created successfully!"
          - "[sound] entity.player.levelup"
          - "[open] dashboard_view"

# ----------------------------------------------------
# Dialogs
# ----------------------------------------------------
dialog:
  # REUSABLE UTILITIES
  delay_back:
    - "[delay] 5"
    - "[back]"

  # CANCEL ACTIONS
  cancel:
    - "[sound] click"
    - "[back]"

  # CONFIRMATION ACTION
  confirm_disband:
    - "[sound] click"
    - "[player] {cmd.team} disband"
    - "[delay] 10"
    - "[player] {cmd.team} disband"
    - "[action] dialog.delay_back"

  confirm_leave:
    - "[sound] click"
    - "[player] {cmd.team} leave"
    - "[action] dialog.delay_back"

  confirm_delete_home:
    - "[sound] click"
    - "[player] {cmd.team} delhome"
    - "[action] dialog.delay_back"

  confirm_update_home:
    - "[sound] click"
    - "[player] {cmd.team} sethome"
    - "[action] dialog.delay_back"

  confirm_neutral:
    - "[sound] click"
    - "[player] {cmd.team} neutral {team}"
    - "[action] dialog.delay_back"

  confirm_delete_warp:
    - "[sound] click"
    - "[player] {cmd.team} delwarp {warp_name}"
    - "[action] dialog.delay_back"

  confirm_admin_demote:
    - "[sound] click"
    - "[player] {cmd.team} demote {player}"
    - "[action] dialog.delay_back"

  confirm_admin_promote:
    - "[sound] click"
    - "[player] {cmd.team} promote {player}"
    - "[action] dialog.delay_back"

  confirm_owner_promote:
    - "[sound] click"
    - "[player] {cmd.team} promote {player}"
    - "[action] dialog.delay_back"

  confirm_default_demote:
    - "[sound] click"
    - "[player] {cmd.team} demote {player}"
    - "[action] dialog.delay_back"

  confirm_kick:
    - "[sound] click"
    - "[player] {cmd.team} kick {player}"
    - "[action] dialog.delay_back"

  confirm_ban:
    - "[sound] click"
    - "[player] {cmd.team} ban {player}"
    - "[action] dialog.delay_back"

