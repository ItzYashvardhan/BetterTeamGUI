home:
  - "[open] dashboard_view"
back:
  - "[open] dashboard_view"

dashboard:
  allies:
    - "[sound] gui.dashboard.allies"
    - "[open] allies_view"
  leave:
    - "[sound] dashboard.leave"
    - "[open] dialog/leave"
  info:
    left-click:
      - "[sound] gui.dashboard.info"
      - "[open] leaderboard_view"
    right-click:
      - "[sound] gui.dashboard.info"
      - "[open] levels_view"
  home:
    left-click:
      - "[sound] gui.dashboard.home"
      - "[player] {cmd.team} home"

    shift-click:
      - "[sound] gui.dashboard.home"
      - "[open] dialog/delete_home"

    right-click:
      when:
        value: "{team_player_has_home}"
        result:
          "true":
            - "[sound] gui.dashboard.home"
            - "[open] dialog/update_home"
          "false":
            - "[sound] gui.dashboard.home"
            - "[player] {cmd.team} sethome"
            - "[close]"
  list:
    - "[sound] gui.dashboard.list"
    - "[open] viewer/list_viewer"

  members:
    - "[sound] gui.dashboard.members"
  team_chest:
    - "[sound] gui.dashboard.team-chest"
    - "[close]"
    - "[player] {cmd.team} echest"
  warps:
