# This file allows you to define custom fonts for different Minecraft client versions.
# You can use these custom fonts to display text in GUIs or messages with unique styles.
# The keys '19' and '16' refer to Minecraft versions 1.19+ and 1.16+ respectively.
# Each letter, number, or special character can be mapped to a custom unicode character.
# If no version is specified for given client version it will used default font
# Currently it doesn't support cas sensitive (i.e 'A' is treat as same as 'a')

