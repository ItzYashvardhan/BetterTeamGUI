    progress-unlockable: ENTITY.PLAYER.LEVELUP, 0.8

  invite:
    invite-item: BLOCK.NOTE_BLOCK.PLING, 2.0
    player-invited-item: BLOCK.NOTE_BLOCK.BASS, 2.0
