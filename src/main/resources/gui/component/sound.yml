    invite-player: click
    invited-list-item: click

  dialog:
    confirm: click
    cancel: click

  allies:
    ally-item: trade
    ally-request-inbox: click
    ally-request-item: click

  team-viewer:
    info: BLOCK.NOTE_BLOCK.CHIME, 2.0
    balance: BLOCK.IRON_DOOR.OPEN, 0.1
    members: trade
    allies: trade
    member-item: trade
    ally-item: trade

  buttons:
    home: click
    back: click
    next: ITEM.BOOK.PAGE_TURN, 1.4
    prev: ITEM.BOOK.PAGE_TURN, 1.4


