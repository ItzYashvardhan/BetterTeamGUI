# Sound Configuration Syntax
# Format: <SOUND_NAME>, [pitch], [volume], [delay]
#
# Suffixes (Optional):
#  p = Pitch (0.5 - 2.0)
#  v = Volume (0.1 - 2.0)
#  d = Delay (in ticks, 20 ticks = 1 second)
#
# Examples:
#  With-Suffix: BLOCK.NOTE_BLOCK.PLING, 2.0p, 40d  (High pitch, plays after 2 seconds)
#  Without-Suffix: BLOCK.NOTE_BLOCK.PLING, 2.0, 1.0, 40
#  Sequence-example:
#       - BLOCK.NOTE_BLOCK.PLING, 1.8p, 5d
#       - BLOCK.NOTE_BLOCK.PLING, 2.9p, 10d
#       - BLOCK.NOTE_BLOCK.PLING, 2.0p, 12d

# Play a Sound for first time when opening a team gui
open_gui: BLOCK.NOTE_BLOCK.CHIME, 2.0

click: UI.BUTTON.CLICK
light_click: click, 2.0
error: BLOCK.NOTE_BLOCK.BASS
permission-error: BLOCK.NOTE_BLOCK.BASS, 2.0
yes-sound: ENTITY.VILLAGER.YES, 2.0
no-sound: ENTITY.VILLAGER.NO, 2.0
trade: ENTITY.VILLAGER.TRADE, 2.0
selected: BLOCK.BEACON.POWER_SELECT, 2.0
locked: BLOCK.NOTE_BLOCK.IRON_XYLOPHONE, 0.1
teleport: ENTITY.ENDERMAN.TELEPORT
light_teleport: ENTITY.ENDERMAN.TELEPORT, 2.0
open_chest: BLOCK.ENDER_CHEST.OPEN
balance: BLOCK.IRON_DOOR.OPEN, 0.1
setting: BLOCK.IRON.PLACE, 0.5
chat:
  global: BLOCK.STONE_BUTTON.CLICK_OFF, 2.0
  team: BLOCK.STONE_BUTTON.CLICK_ON, 2.0
  ally: BLOCK.STONE_BUTTON.CLICK_ON, 2.0

# Turn pages
next: ITEM.BOOK.PAGE_TURN, 1.4
prev: ITEM.BOOK.PAGE_TURN, 1.4

anvil-ui:
  cancel-sound: click, 2.0
  invalid-sound: BLOCK.BELL.USE, 0.1
  submit-sound: BLOCK.ANVIL.PLACE, 1.4


# GUI Sounds
gui:

  members:
    member-item: click, 1.0
    invite-button: click, 1.0
    locked-invite: BLOCK.NOTE_BLOCK.IRON_XYLOPHONE, 0.1
    ban-list: click, 1.0

  setting:
    color-picker: click
    description: click
    tag: click
    status: click
    anchor: click
    no-anchor: click
    title: click
    pvp: click
    rename: click
    disband: click

  members-management:
    promote: yes-sound
    demote: no-sound
    kick: ENTITY.VILLAGER.HURT, 2.0
    ban: ENTITY.VILLAGER.DEATH, 2.0

  invited-players:
    invited-player-item: ENTITY.VILLAGER.NO, 2.0

  leaderboard:
