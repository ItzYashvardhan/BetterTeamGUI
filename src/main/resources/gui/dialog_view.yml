leave-view:
  main:
    title: "<bold>Leave Team?</bold>"
    row: 3
    font-title: false
    font-name: false
    font-lore: true
    background:
      0:
        name: " "
        item: LIGHT_BLUE_STAINED_GLASS_PANE
        slot: [ 0,2,4,6,8,9,11,13,15,17,18,20,22,24,26 ]
        flags:
          - HIDE_ATTRIBUTES
          - HIDE_ADDITIONAL_TOOLTIP
      1:
        name: " "
        item: PURPLE_STAINED_GLASS_PANE
        slot: [ 1,3,5,7,10,12,14,16,19,21,23,25 ]
        flags:
          - HIDE_ATTRIBUTES
          - HIDE_ADDITIONAL_TOOLTIP

  confirm:
    name: "<b><gradient:#00FF00:#00AA00>CONFIRM</gradient></b>"
    lore:
      - "<gray>Click to confirm leaving your team.</gray>"
    item: LIME_WOOL
    slot: 11

  cancel:
    name: "<b><gradient:#FF0000:#AA0000>CANCEL</gradient></b>"
    lore:
      - "<gray>Click to cancel and return to the team menu.</gray>"
    item: RED_WOOL
    slot: 15

