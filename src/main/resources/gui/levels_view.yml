main:
  title: "<bold><gradient:#C45700:#FF7608>{team} Team Level's</bold>"
  row: 6
  font-title: false
  font-name: true
  font-lore: true
  background:
    0:
      name: " "
      item: LIGHT_BLUE_STAINED_GLASS_PANE
      slot: [ 0,2,4,6,8,18,26,36,44,46,48,50,52 ]
    1:
      name: " "
      item: PURPLE_STAINED_GLASS_PANE
      slot: [ 1,3,5,7,9,17,27,35,45,47,49,51,53 ]
  slot:
    home: 53
    prev: 47
    next: 51

level-item:
  default:
    unlocked:
      name: "<b><#5BD686>Level {level} </b><gray>(Unlocked)"
      lore:
        - "<gray>You have already passed this level.</gray>"
        - ""
        - " <#5BD686>✔ Completed</#5BD686>"
      item: LIME_STAINED_GLASS_PANE
      texture: ""

    current:
      name: "<b><#36FA00>Level {level} </b>(Current)"
      lore:
        - "<gray>Your team is currently at this level.</gray>"
        - ""
        - "<b><gradient:#FF60C1:#F30094>Current Perks"
        - " <#36FA00>• <white>Members Size <#36FA00>{team_limit}</white>"
        - " <#36FA00>• <white>Warps Limit <#36FA00>{warp_limit}</white>"
        - " <#36FA00>• <white>Amount Limit <#36FA00>{max_bal}</white>"
        - " <#36FA00>• <white>Max Chests <#36FA00>{max_chests}</white>"
        - " <#36FA00>• <white>Max Admins <#36FA00>{max_admins}</white>"
        - " <#36FA00>• <white>Max Owners <#36FA00>{max_owners}</white>"
        - " "
        - " <#36FA00>◆ Active"
      item: EMERALD
      texture: ""
      glow: true

    progress:
      name: "<b><#F8CB67>Level {level} </b><gray>(In Progress)"
      lore:
        - "<gray>Reach this level to unlock perks.</gray>"
        - ""
        - "<b><gradient:#FF60C1:#F30094>New Perks"
        - " <#F8CB67>• <white>Members Size <#F8CB67>{team_limit}</white>"
        - " <#F8CB67>• <white>Warps Limit <#F8CB67>{warp_limit}</white>"
        - " <#F8CB67>• <white>Amount Limit <#F8CB67>{max_bal}</white>"
        - " <#F8CB67>• <white>Max Chests <#F8CB67>{max_chests}</white>"
        - " <#F8CB67>• <white>Max Admins <#F8CB67>{max_admins}</white>"
        - " <#F8CB67>• <white>Max Owners <#F8CB67>{max_owners}</white>"
        - ""
        - "<b><#FF3B3B>Requirement"
        - " <#FF3B3B>❌<#FF3B3B> <white>{required_type} <#FF3B3B><b>{required_amount}"

      item: ORANGE_STAINED_GLASS_PANE
      texture: ""

    progress-unlockable:
      name: "<b><#F8CB67>Level {level} </b><gray>(In Progress)"
      lore:
        - "<gray>Reach this level to unlock perks.</gray>"
        - ""
        - "<b><gradient:#FF60C1:#F30094>New Perks"
        - " <#F8CB67>• <white>Members Size <#F8CB67>{team_limit}</white>"
        - " <#F8CB67>• <white>Warps Limit <#F8CB67>{warp_limit}</white>"
        - " <#F8CB67>• <white>Amount Limit <#F8CB67>{max_bal}</white>"
        - " <#F8CB67>• <white>Max Chests <#F8CB67>{max_chests}</white>"
        - " <#F8CB67>• <white>Max Admins <#F8CB67>{max_admins}</white>"
        - " <#F8CB67>• <white>Max Owners <#F8CB67>{max_owners}</white>"
        - ""
        - "<b><#FF3B3B>Requirement"
        - " <#36FA00>✔<#36FA00> <white>{required_type} <#36FA00><b>{required_amount}"
        - ""
        - "<b><#36FA00>Left-Click to Rank Up"
      item: ORANGE_STAINED_GLASS_PANE
      texture: ""

    locked:
      name: "<b><#FF3B3B>Level {level} </b><dark_gray>(Locked)"
      lore:
        - "<gray>This level is Currently locked.</gray>"
        - ""
