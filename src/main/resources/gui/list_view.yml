main:
  title: "<bold>Global Team List</bold>"
  row: 6
  font-title: true # Weather to enabled font for title
  font-name: true # Weather to enabled font for name
  font-lore: true # Whether to enabled font for lore
  background:
    0:
      item: LIGHT_BLUE_STAINED_GLASS_PANE
      slot: [ 0,2,4,6,8,18,26,36,44,46,48,50,52 ]
      flags:
        - HIDE_ATTRIBUTES
    1:
      item: PURPLE_STAINED_GLASS_PANE
      slot: [ 1,3,5,7,9,17,27,35,45,47,49,51,53 ]
  slot:
    back: 52
    home: 53

team-item:
  name: "<yellow>%betterteams_name% <#D6BA5B>(%betterteams_members%/%betterteams_maxmembers%)"
  lore:
    - "<#5BD686>Level:</#5BD686> <#D6BA5B>%betterteams_level%"
    - "<#5BD686>Score:</#5BD686> <#D6BA5B>%betterteams_score%"
    - ""
    - "<yellow>Left-Click</yellow> <gray>to view team</gray>"
  item: PLAYER_HEAD
  texture: ""

sort:
  order:
    ASC:
      item: LEVER
      slot: 50
      name: "<green>Order: <white>Ascending"
      lore:
        - "<gray>Sorts the list from lowest to highest.</gray>"
        - ""
        - "<yellow>Click to switch to Descending ⬇</yellow>"
    DESC:
      item: REDSTONE_TORCH
      slot: 50
      name: "<green>Order: <white>Descending"
      lore:
        - "<gray>Sorts the list from highest to lowest.</gray>"
        - ""
        - "<yellow>Click to switch to Ascending ⬆</yellow>"
  type:
    MONEY:
      item: SUNFLOWER
      slot: 49
      name: "<aqua>Sort By: <white>Money"
      lore:
        - "<gray>Currently sorting by team balance.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    SCORE:
      item: NETHER_STAR
      slot: 49
      name: "<aqua>Sort By: <white>Score"
      lore:
        - "<gray>Currently sorting by team score.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    LEVEL:
      item: EXPERIENCE_BOTTLE
      slot: 49
      name: "<aqua>Sort By: <white>Level"
      lore:
        - "<gray>Currently sorting by team level.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    MEMBERS:
      item: PLAYER_HEAD
      slot: 49
      name: "<aqua>Sort By: <white>Members"
      lore:
        - "<gray>Currently sorting by member count.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"

filter:
  DEFAULT:
    item: HOPPER
    slot: 48
    name: "<gold>Filter: <white>None"
    lore:
      - "<gray>Showing all teams.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"

  OPEN_ONLY:
    item: OAK_DOOR
    slot: 48
    name: "<gold>Filter: <white>Open Teams"
    lore:
      - "<gray>Only showing teams that are open.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"
  CURRENTLY_ONLINE:
    item: LIME_DYE
    slot: 48
    name: "<gold>Filter: <white>Online Now"
    lore:
      - "<gray>Only showing teams with online members.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"
  NOT_FULL:
    item: CHEST
    slot: 48
    name: "<gold>Filter: <white>Not Full"
    lore:
      - "<gray>Only showing teams with available slots.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"








