main:
  title: "<bold><gradient:#C45700:#FF7608>Team List (Page - {page})</bold>"
  row: 6
  font-title: false
  font-name: false
  font-lore: true
  background:
    0:
      name: " "
      item: LIGHT_BLUE_STAINED_GLASS_PANE
      slot: [ 0,2,4,6,8,18,26,36,44,46,48,50,52 ]
      flags:
        - HIDE_ATTRIBUTES
    1:
      name: " "
      item: PURPLE_STAINED_GLASS_PANE
      slot: [ 1,3,5,7,9,17,27,35,45,47,49,51,53 ]
  slot:
    back: 52
    home: 53
    prev: 47
    next: 51

# We use custom placeholders because BetterTeams placeholders do not work when the entire team is offline.
# For example, %betterteams_description% would return nothing if the team is offline.
# Our custom placeholders ensure that team information is always displayed correctly.
# Note: It may not work for every item

team-item-with-description:
  name: "<b>{team_color_code}{team}{/team_color_code}</b> <gray>({team_size}/{team_limit})</gray>"
  lore:
    - "<white><italic>{team_description}</italic></white>"
    - " "
    - " <#5BD686>• Tag:</#5BD686> <white><bold>{team}</bold></white>"
    - " <#5BD686>• Level:</#5BD686> <#D6BA5B>{team_size}"
    - " <#5BD686>• Score:</#5BD686> <#D6BA5B>{team_limit}"
    - " <#5BD686>• Active:</#5BD686> <#D6BA5B>{team_level}"
    - ""
    - "<yellow>Left-Click</yellow> <gray>to view team</gray>"
  item: PLAYER_HEAD
  texture: ""

team-item-without-description:
  name: "<b>{team_color_code}{team}{/team_color_code}</b> <gray>({team_size}/{team_limit})</gray>"
  lore:
    - " <#5BD686>• Tag:</#5BD686> <white><bold>{team}</bold></white>"
    - " <#5BD686>• Level:</#5BD686> <#D6BA5B>{team_size}"
    - " <#5BD686>• Score:</#5BD686> <#D6BA5B>{team_limit}"
    - " <#5BD686>• Active:</#5BD686> <#D6BA5B>{team_level}"
    - ""
    - "<yellow>Left-Click</yellow> <gray>to view team</gray>"
  item: PLAYER_HEAD
  texture: ""


search-item:
  name: "<caps><b><#00FFC7>Search by Name"
  lore:
    - "<gray>Click to search for a team by its name.</gray>"
  item: OAK_SIGN
  slot: 45

sort:
  order:
    ASC:
      item: LEVER
      slot: 50
      name: "<caps><green>Order: <white>Ascending"
      lore:
        - "<gray>Sorts the list from lowest to highest.</gray>"
        - ""
        - "<yellow>Click to switch to Descending ⬇</yellow>"
    DESC:
      item: REDSTONE_TORCH
      slot: 50
      name: "<caps><green>Order: <white>Descending"
      lore:
        - "<gray>Sorts the list from highest to lowest.</gray>"
        - ""
        - "<yellow>Click to switch to Ascending ⬆</yellow>"
  type:
    MONEY:
      item: SUNFLOWER
      slot: 49
      name: "<caps><aqua>Sort By: <white>Money"
      lore:
        - "<gray>Currently sorting by team balance.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    SCORE:
      item: NETHER_STAR
      slot: 49
      name: "<caps><aqua>Sort By: <white>Score"
      lore:
        - "<gray>Currently sorting by team score.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    LEVEL:
      item: EXPERIENCE_BOTTLE
      slot: 49
      name: "<caps><aqua>Sort By: <white>Level"
      lore:
        - "<gray>Currently sorting by team level.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"
    MEMBERS:
      item: PLAYER_HEAD
      slot: 49
      name: "<caps><aqua>Sort By: <white>Members"
      lore:
        - "<gray>Currently sorting by member count.</gray>"
        - ""
        - "<yellow>Click to cycle sort mode ➤</yellow>"

filter:
  DEFAULT:
    item: HOPPER
    slot: 48
    name: "<caps><gold>Filter: <white>None"
    lore:
      - "<gray>Showing all teams.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"

  OPEN_ONLY:
    item: OAK_DOOR
    slot: 48
    name: "<caps><gold>Filter: <white>Open Teams"
    lore:
      - "<gray>Only showing teams that are open.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"
  CURRENTLY_ONLINE:
    item: LIME_DYE
    slot: 48
    name: "<caps><gold>Filter: <white>Online Now"
    lore:
      - "<gray>Only showing teams with online members.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"
  NOT_FULL:
    item: CHEST
    slot: 48
    name: "<caps><gold>Filter: <white>Not Full"
    lore:
      - "<gray>Only showing teams with available slots.</gray>"
      - ""
      - "<yellow>Click to change filter ➤</yellow>"


anvil-ui:
