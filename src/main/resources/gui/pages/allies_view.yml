main:
  title: "lang.allies_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . I . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  template:
    name: "lang.allies_view_item_name"
    lore: ["lang.allies_view_item_lore"]
    item: PLAYER_HEAD
    texture: "{ally_uuid}" # Dynamically replaced by your Kotlin backend
    action: "allies.view_profile"

# ----------------------------------------------------
# CORE BUTTONS (Mapped to Pattern)
# ----------------------------------------------------
ally_request_inbox:
  name: "lang.allies_view_requests_name"
  char: "I"
  lore: ["lang.allies_view_requests_lore"]
  item: CHEST
  action: "[open_gui] ally_requests"