main:
  title: "lang.color_picker_title"
  rows: 5
  inherit:
    - "template/background"
    - "template/nav --R"
  pattern:
    - ". . . . . . . . ."
    - ". a b c . d e f ."
    - ". g h i . j k l ."
    - ". m n . . . o p ."
    - ". . . . . . . R ."

