main:
  title: "lang.dashboard_title"
  rows: 4
  inherit:
    - template/background
  pattern:
    - ". . . . . . . . ."
    - ". I . H A M C . ."
    - ". D . W E T S . ."
    - ". . . . . . . . ."
  requirement:
    condition:
      - "[condition] '{team}' != ''"
    on-deny:
      - "[open] pager/team_list"

# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
dashboard_leave:
  char: "L"
  material: PLAYER_HEAD
  texture: "dashboard.leave"
  action: "dashboard.leave"

