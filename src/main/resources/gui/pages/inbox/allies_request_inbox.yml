main:
  title: "lang.allies_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_request_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    allies-item:
      name: "lang.allies_view_req_item_name"
      lore: [ "lang.allies_view_req_item_lore" ]
      material: PLAYER_HEAD
      left-click:
        - "[sound] click"
        - "[player] {cmd.team} ally {team}"
        - "[delay] 4"
        - "[refresh]"
      right-click:
        - "[sound] click"
        - "[open] view/team"
      shift-click:
        - "[sound] click"
        - "[player] {cmd.team} neutral {team}"
        - "[delay] 4"
        - "[refresh]"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"


