main:
  title: "lang.allies_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . . . I . . . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    allies-item:
      name: "lang.allies_view_req_item_name"
      lore: [ "lang.allies_view_req_item_lore" ]
      item: PLAYER_HEAD
      left-click:
        - "[sound] click"
        - "[player] {cmd.team} ally {team}"
        - "[refresh]"
      right-click:
        - "[sound] click"
        - "[open] view/team"
      shift-click:
        - "[sound] click"
        - "[player] {cmd.team} neutral {team}"
        - "[refresh]"

ally_request_item:
  char: "I"
  name: "lang.allies_view_requests_name"
  lore: [ "lang.allies_view_requests_lore" ]
  item: CHEST
  action: "inbox.allies_request"



prev_page:
  name: "lang.core_prev_page_name"
  slot: 47
  priority: 1
  item: PLAYER_HEAD
  texture: "core.prev_page"
  action: "core_prev_page"

next_page:
  name: "lang.core_next_page_name"
  slot: 51
  priority: 1
  item: PLAYER_HEAD
  texture: "core.next_page"
  action: "core_next_page"


