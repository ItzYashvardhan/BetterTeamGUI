main:
  title: "lang.invitation_title"
  type: pager
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

dynamic_list:
  char: "L"
  populator_id: "invitation_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    invitation-item:
      name: "<gold><b>{team_name}</b>"
      lore:
        - "lang.invitation_lore"
        - ""
        - "<yellow>Left-click to join"
        - "<red>Right-click to deny"
      material: PLAYER_HEAD
      left-click:
        - "[sound] click"
        - "[player] {cmd.team} join {team_name}"
        - "[close]"
      right-click:
        - "[sound] click"
        - "[player] {cmd.team} deny {team_name}"
        - "[refresh]"

prev_page:
  name: "lang.buttons_prev_name"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  name: "lang.buttons_next_name"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"