main:
  title: "lang.invited_players_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

dynamic_list:
  char: "L"
  populator_id: "invited_players_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  template:
    display: "lang.invited_players_view_item"
    material: PLAYER_HEAD
    texture: "{player_uuid}"
    action: "invite.revoke"

prev_page:
  display: "lang.core_prev_page"
  char: "<"
  priority: 1
  material: PLAYER_HEAD
  texture: "core.prev_page"
  action: "core_prev_page"

next_page:
  display: "lang.core_next_page"
  char: ">"
  priority: 1
  material: PLAYER_HEAD
  texture: "core.next_page"
  action: "core_next_page"
