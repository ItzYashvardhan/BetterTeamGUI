main:
  title: "lang.members_management_view_title"
  rows: 3
  inherit:
    - "template/background"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". I . E D . K L ." # I=Info, E=Promote, D=Demote, K=Kick, L=Ban
    - ". . . . . . . . ."


# ----------------------------------------------------
# TARGET INFO
# ----------------------------------------------------
members_management_view_player_info:
  char: "I"
  material: PLAYER_HEAD
  name: "lang.members_management_view_player_info_name"
  lore:
  - "lang.members_management_view_player_info_lore"
  - " "
  - "You rank is {viewer_rank}"

# ----------------------------------------------------
# CONDITIONAL PROMOTION STACK (Char 'E')
# ----------------------------------------------------
members_management_view_promote_owner:
  char: "E"
  priority: 10
  view-requirement:
    - "[condition] '{rank}' == 'Admin'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  glow: false
  texture: "members.promote"
  click-sound: gui.members-management.promote
  action: "members.promote_owner"

# Allows Owners to promote Defaults to Admin
promote-to-admin-by-owner:
  display: "lang.members_management_view_promote_admin"
  char: "E"
  priority: 6
  view-requirement:
    - "[condition] '{rank}' == 'Default'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  glow: false
  texture: "members.promote"
  click-sound: gui.members-management.promote
  action: "members.promote_admin"

# Allows Admins to promote Defaults to Admin
promote-to-admin:
  display: "lang.members_management_view_promote_admin"
  char: "E"
  priority: 5
  view-requirement:
    - "[condition] '{rank}' == 'Default'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  glow: false
  texture: "members.promote"
  click-sound: gui.members-management.promote
  action: "members.promote_admin"

# ----------------------------------------------------
# CONDITIONAL DEMOTION STACK (Char 'D')
# ----------------------------------------------------
members_management_view_demote_admin:
  char: "D"
  priority: 10
  view-requirement:
    - "[condition] '{rank}' == 'Owner'"
    - "[condition] '{viewer_rank}' == 'Owner'"
    - "[condition] '{viewer}' == '{player}'"
  material: PLAYER_HEAD
  glow: false
  texture: "members.demote"
  click-sound: gui.members-management.demote
  action: "members.demote_admin"

members_management_view_demote_default:
  char: "D"
  priority: 5
  view-requirement:
    - "[condition] '{rank}' == 'Admin'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  glow: false
  texture: "members.demote"
  click-sound: gui.members-management.demote
  action: "members.demote_default"

# ----------------------------------------------------
# PUNISHMENT STACKS (Char 'K' and 'L')
# ----------------------------------------------------
kick-admin:
  display: "lang.members_management_view_kick"
  char: "K"
  priority: 10
  view-requirement:
    - "[condition] '{rank}' == 'Admin'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  texture: "members.kick"
  action: "members.kick"

kick-default:
  display: "lang.members_management_view_kick"
  char: "K"
  priority: 5
  view-requirement:
    - "[condition] '{rank}' == 'Default'"
  material: PLAYER_HEAD
  texture: "members.kick"
  action: "members.kick"

ban-admin:
  display: "lang.members_management_view_ban"
  char: "L"
  priority: 10
  view-requirement:
    - "[condition] '{rank}' == 'Admin'"
    - "[condition] '{viewer_rank}' == 'Owner'"
  material: PLAYER_HEAD
  texture: "members.ban"
  action: "members.ban"

ban-default:
  display: "lang.members_management_view_ban"
  char: "L"
  priority: 5
  view-requirement:
    - "[condition] '{rank}' == 'Default'"
  material: PLAYER_HEAD
  texture: "members.ban"
  action: "members.ban"

# ----------------------------------------------------
# FALLBACKS (Priority 1)
# ----------------------------------------------------
no-permission-e:
  char: "E"
  priority: 1
  material: RED_STAINED_GLASS_PANE
  name: " "

no-permission-d:
  char: "D"
  priority: 1
  material: RED_STAINED_GLASS_PANE
  name: " "

no-permission-k:
  char: "K"
  priority: 1
  material: RED_STAINED_GLASS_PANE
  name: " "

no-permission-b:
  char: "L"
  priority: 1
  material: RED_STAINED_GLASS_PANE
  name: " "
