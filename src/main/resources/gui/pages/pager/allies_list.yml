main:
  title: "lang.allies_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . I . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    allies-item:
      name: "lang.allies_view_item_name"
      lore: [ "lang.allies_view_item_lore" ]
      material: PLAYER_HEAD

prev_page:
  name: "lang.buttons_prev_name"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  name: "lang.buttons_next_name"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"


# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
ally_request_item:
  char: "I"
  name: "lang.allies_view_requests_name"
  lore: [ "lang.allies_view_requests_lore" ]
  material: CHEST
  action: "inbox.allies_request"