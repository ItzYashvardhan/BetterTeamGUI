  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . . . I . . . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    allies-item:
      name: "lang.allies_view_item_name"
      lore: ["lang.allies_view_item_lore"]
      item: PLAYER_HEAD
      texture: "{ally_uuid}" # Dynamically replaced by code
      action: "allies.view_profile"

prev_page:
  name: "lang.core_prev_page_name"
  slot: 47
  priority: 1
  item: PLAYER_HEAD
  texture: "core.prev_page"
  action: "core_prev_page"

next_page:
  name: "lang.core_next_page_name"
  slot: 51
  priority: 1
  item: PLAYER_HEAD
  texture: "core.next_page"
  action: "core_next_page"


# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
ally_request_inbox:
  name: "lang.allies_view_requests_name"
  char: "I"
  lore: ["lang.allies_view_requests_lore"]
  item: CHEST
  action: "[open_gui] ally_requests"