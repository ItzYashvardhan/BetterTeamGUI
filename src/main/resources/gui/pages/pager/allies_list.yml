main:
  title: "lang.ally_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . I . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    ally_item:
      material: PLAYER_HEAD
      left-click:
        - "[action] view.team"
      shift-click:
        - "[sound] click"
        - "[open] dialog/neutral"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"


# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
allies_view_requests:
  char: "I"
  material: CHEST
  action: "inbox.allies_request"