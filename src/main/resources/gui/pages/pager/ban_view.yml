main:
  title: "lang.ban_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . . "
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > R H"

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "banned_players"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    ban-item:
      name: "lang.ban_view_item_name"
      lore: ["lang.ban_view_item_lore"]
      material: PLAYER_HEAD
      texture: "{team_player_uuid}" # Dynamically replaced by CODE
      action: "bans.manage_player"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"