main:
  title: "lang.invite_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - "S I < . V . > R H"

dynamic_list:
  char: "L"
  populator_id: "invite_players_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  template:
    name: "lang.invite_view_invite_item_name"
    lore:
      - "lang.invite_view_invite_item_lore"
    material: PLAYER_HEAD
    texture: "{player_uuid}"
    action: "invite.send"

prev_page:
  name: "lang.buttons_prev_name"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  name: "lang.buttons_next_name"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"

player-invited-item:
  name: "lang.invite_view_player_invited_item_name"
  lore:
    - "lang.invite_view_player_invited_item_lore"
  material: PLAYER_HEAD
  texture: "{player_uuid}"
  action: "invite.cancel"

search-item:
  name: "lang.invite_view_search_item_name"
  char: "S"
  priority: 0
  lore:
    - "lang.invite_view_search_item_lore"
  material: OAK_SIGN
  action: "invite.search"

search-item-clear:
  name: "lang.invite_view_search_item_clear_name"
  char: "S"
  priority: 10
  view-requirement:
    - "[condition] is_searching"
  lore:
    - "lang.invite_view_search_item_clear_lore"
  material: OAK_SIGN
  action: "invite.clear_search"

invite-player:
  name: "lang.invite_view_invite_player_name"
  char: "I"
  lore:
    - "lang.invite_view_invite_player_lore"
  material: LIME_STAINED_GLASS_PANE
  action: "invite.custom"

invited-list-item:
  name: "lang.invite_view_invited_list_item_name"
  char: "V"
  lore:
    - "lang.invite_view_invited_list_item_lore"
  material: WRITABLE_BOOK
  action: "[open_gui] invited_list"

anvil-ui:
  search-item:
    title: "lang.invite_view_anvil_search_title"
    label: "lang.invite_view_anvil_label"
    input-item:
      name: "lang.invite_view_anvil_search_input_name"
      material: PAPER
      lore:
        - "lang.invite_view_anvil_search_input_lore"
    output-item:
      name: "lang.invite_view_anvil_search_output_name"
      material: ANVIL
      lore:
        - "lang.invite_view_anvil_search_output_lore"
  invite:
    title: "lang.invite_view_anvil_invite_title"
    label: "lang.invite_view_anvil_label"
    input-item:
      name: "lang.invite_view_anvil_invite_input_name"
      lore:
        - "lang.invite_view_anvil_invite_input_lore"
      material: PAPER
    output-item:
      name: "lang.invite_view_anvil_invite_output_name"
      lore:
        - "lang.invite_view_anvil_invite_output_lore"
      material: LIME_DYE