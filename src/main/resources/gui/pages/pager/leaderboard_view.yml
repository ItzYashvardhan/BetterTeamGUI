main:
  title: "{lang:leaderboard_view_title}"
  rows: 6
  font-title: false
  font-name: false
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . . . . . . . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "leaderboard_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  template:
    name: "lang.leaderboard_view_item_name"
    lore: ["lang.leaderboard_view_item_lore"]
    item: PLAYER_HEAD
    texture: "{player_uuid}"
    click-sound: gui.leaderboard.team-leaderboard-item

# ----------------------------------------------------
# CORE BUTTONS (Mapped to Pattern)
# ----------------------------------------------------
prev_page:
  name: "lang.core_prev_page_name"
  char: "<"
  item: PLAYER_HEAD
  texture: "core.prev_page"
  action: "core_prev_page"

next_page:
  name: "lang.core_next_page_name"
  char: ">"
  item: PLAYER_HEAD
  texture: "core.next_page"
  action: "core_next_page"