main:
  title: "{lang:leaderboard_view_title}"
  rows: 6
  font-title: false
  font-name: false
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "leaderboard_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    leaderboard:
      name: "lang.leaderboard_view_item_name"
      lore: ["lang.leaderboard_view_item_lore"]
      material: PLAYER_HEAD
      texture: "{player_uuid}"
      click-sound: gui.leaderboard.team-leaderboard-item

prev_page:
  name: "lang.buttons_prev_name"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  name: "lang.buttons_next_name"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"