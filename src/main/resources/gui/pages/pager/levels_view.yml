main:
  title: "lang.levels_view_title"
  rows: 6
  font-title: false
  font-name: true
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "levels_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    # ----------------------------------------------------
    # LEVEL STATES
    # ----------------------------------------------------
    unlocked:
      name: "lang.levels_view_unlocked_name"
      lore:
        - "lang.levels_view_unlocked_lore"
      material: LIME_STAINED_GLASS_PANE
      texture: ""
      click-sound: gui.levels.default

    current:
      name: "lang.levels_view_current_name"
      lore:
        - "lang.levels_view_current_lore"
        - ""
        - "lang.levels_view_current_perks_header"
        - "lang.levels_view_perks_members"
        - "lang.levels_view_perks_warps"
        - "lang.levels_view_perks_balance"
        - "lang.levels_view_perks_chests"
        - "lang.levels_view_perks_admins"
        - "lang.levels_view_perks_owners"
        - " "
        - "lang.levels_view_current_active"
      material: EMERALD
      texture: ""
      glow: true
      click-sound: gui.levels.current

    progress:
      name: "lang.levels_view_progress_name"
      lore:
        - "lang.levels_view_progress_lore"
        - ""
        - "lang.levels_view_new_perks_header"
        - "lang.levels_view_perks_members"
        - "lang.levels_view_perks_warps"
        - "lang.levels_view_perks_balance"
        - "lang.levels_view_perks_chests"
        - "lang.levels_view_perks_admins"
        - "lang.levels_view_perks_owners"
        - ""
        - "lang.levels_view_requirement_header"
        - "lang.levels_view_requirement_fail"
      material: ORANGE_STAINED_GLASS_PANE
      texture: ""
      click-sound: gui.levels.progress

    progress-unlockable:
      name: "lang.levels_view_progress_name"
      lore:
        - "lang.levels_view_progress_lore"
        - ""
        - "lang.levels_view_new_perks_header"
        - "lang.levels_view_perks_members"
        - "lang.levels_view_perks_warps"
        - "lang.levels_view_perks_balance"
        - "lang.levels_view_perks_chests"
        - "lang.levels_view_perks_admins"
        - "lang.levels_view_perks_owners"
        - ""
        - "lang.levels_view_requirement_header"
        - "lang.levels_view_requirement_success"
        - ""
        - "lang.levels_view_click_rankup"
      material: ORANGE_STAINED_GLASS_PANE
      texture: ""
      click-sound: gui.levels.progress-unlockable
      action: "level.rankup"

    locked:
      name: "lang.levels_view_locked_name"
      lore:
        - "lang.levels_view_locked_lore"
        - ""
        - "lang.levels_view_locked_requirement"
      material: RED_STAINED_GLASS_PANE
      texture: ""
      click-sound: gui.levels.locked

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"

home:
  display: "lang.buttons_home"
  char: "H"
  material: PLAYER_HEAD
  texture: "texture:core.home"
  action: "home"