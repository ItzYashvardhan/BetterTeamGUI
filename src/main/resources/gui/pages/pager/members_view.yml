main:
  title: "lang.member_title"
  rows: 6
  font-title: false
  font-name: true
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - "B . < . . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "members_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    member_item:
      name: "lang.members_view_member_name"
      lore: ["lang.members_view_member_lore_admin"]
      material: PLAYER_HEAD
      action: "members.manage"

    member-item-no-admin:
      name: "lang.members_view_member_name"
      lore: ["lang.members_view_member_lore_default"]
      material: PLAYER_HEAD
      action: "members.view"

    invite-button:
      name: "lang.members_view_invite_name"
      lore: ["lang.members_view_invite_lore"]
      material: LIME_STAINED_GLASS_PANE
      action: "members.invite"

    locked-invite:
      name: "lang.members_view_locked_name"
      lore: ["lang.members_view_locked_lore"]
      material: RED_STAINED_GLASS_PANE
      action: "members.locked_invite"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"

# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
members_view_banlist:
  char: "B"
  material: PLAYER_HEAD
  texture: "members.ban_list"
  action: "[open] ban_list"
  click-sound: gui.members.ban-list

home:
  display: "lang.buttons_home"
  char: "H"
  material: PLAYER_HEAD
  texture: "core.home"
  action: "home"