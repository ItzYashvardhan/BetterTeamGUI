# ===================================================================
# TEAM LIST
# ===================================================================
main:
  title: "lang.list_view_title"
  rows: 6
  inherit:
    - "template/border"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - "S . . F T O . . H"

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "teams_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    # ----------------------------------------------------
    # TEAM STATE TEMPLATES (Fetched by Kotlin Backend)
    # ----------------------------------------------------
    team-item-with-description-in-team:
      name: "lang.list_view_team_item_name_in_team"
      lore:
        - "lang.list_view_team_item_desc"
        - " "
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_team_item_lore_click"
      item: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-without-description-in-team:
      name: "lang.list_view_team_item_name_in_team"
      lore:
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_team_item_lore_click"
      item: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-with-description-no-team:
      name: "lang.list_view_team_item_name_no_team"
      lore:
        - "lang.list_view_team_item_desc"
        - " "
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_team_item_lore_click"
        - "lang.list_view_team_item_lore_join"
      item: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-without-description-no-team:
      name: "lang.list_view_team_item_name_no_team"
      lore:
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_team_item_lore_click"
        - "lang.list_view_team_item_lore_join"
      item: PLAYER_HEAD
      texture: ""
      action: "view.team"

    invitation-team-item:
      name: "lang.list_view_invitation_team_item_name"
      lore:
        - "lang.list_view_team_item_desc"
        - " "
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_invitation_team_item_lore_accept"
      item: PLAYER_HEAD
      texture: ""
      action: "view.team"

prev_page:
  name: "lang.core_prev_page_name"
  slot: 47
  priority: 1
  item: PLAYER_HEAD
  texture: "core.prev_page"
  action: "core_prev_page"

next_page:
  name: "lang.core_next_page_name"
  slot: 51
  priority: 1
  item: PLAYER_HEAD
  texture: "core.next_page"
  action: "core_next_page"


# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
search-item:
  char: "S"
  name: "lang.list_view_search_name"
  lore: [ "lang.list_view_search_lore" ]
  item: OAK_SIGN
  click-sound: gui.list.search-item



filter_default:
  char: "F"
  name: "lang.list_view_filter_default_name"
  lore: [ "lang.list_view_filter_default_lore" ]
  item: HOPPER
  click-sound: gui.list.filter

sort_type_money:
  char: "T"
  name: "lang.list_view_sort_money_name"
  lore: [ "lang.list_view_sort_money_lore" ]
  item: SUNFLOWER
  click-sound: gui.list.sort

sort_order_asc:
  char: "O"
  name: "lang.list_view_sort_asc_name"
  lore: [ "lang.list_view_sort_asc_lore" ]
  item: LEVER
  click-sound: gui.list.sort

invitation:
  slot: 52
  priority: 1
  name: "lang.list_view_invitation_name"
  lore: [ "lang.list_view_invitation_lore" ]
  item: CHEST
  view-requirement:
    - "[condition] '{team}' == ''"
  click:
    - "[open] pager/invitation_view"

create:
  char: "H"
  name: "lang.list_view_create_name"
  lore: [ "lang.list_view_create_lore" ]
  item: PLAYER_HEAD
  texture: "list.create"
  action: "team_list.create"
  view-requirement:
    - "[condition] '{team}' == ''"


home:
  char: "H"
  name: "lang.buttons_home_name"
  item: PLAYER_HEAD
  texture: "texture:core.home"
  action: "home"
  view-requirement:
    - "[condition] '{team}' != ''"

