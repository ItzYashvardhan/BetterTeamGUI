# ===================================================================
# TEAM LIST
# ===================================================================
main:
  title: "{list_dynamic_title}"
  rows: 6
  inherit:
    - "template/border"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - "S C < F T O > . H"

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "teams_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    # ----------------------------------------------------
    # TEAM STATE TEMPLATES
    # ----------------------------------------------------
    team-item-with-description-in-team:
      name: "lang.team_name"
      lore:
        - "lang.team_desc"
        - " "
        - "lang.team_common"
        - ""
        - "lang.team_click"
      material: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-without-description-in-team:
      name: "lang.team_name"
      lore:
        - "lang.team_common"
        - ""
        - "lang.team_click"
      material: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-with-description-no-team:
      name: "lang.team_name"
      lore:
        - "lang.team_desc"
        - " "
        - "lang.team_common"
        - ""
        - "lang.team_click"
        - "lang.team_join"
      material: PLAYER_HEAD
      texture: ""
      action: "view.team"

    team-item-without-description-no-team:
      name: "lang.team_name"
      lore:
        - "lang.team_common"
        - ""
        - "lang.team_click"
        - "lang.team_join"
      material: PLAYER_HEAD
      texture: ""
      action: "view.team"

    invitation-team-item:
      name: "lang.team_name"
      lore:
        - "lang.list_view_team_item_desc"
        - " "
        - "lang.list_view_team_item_lore_common"
        - ""
        - "lang.list_view_invitation_team_item_lore_accept"
      material: PLAYER_HEAD
      texture: ""
      action: "view.team"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"


# ----------------------------------------------------
# CORE BUTTONS
# ----------------------------------------------------
list_view_search:
  char: "S"
  material: OAK_SIGN
  click:
    - "[sound] light_click"
    - "[input] team/search"

list_view_clear_search:
  char: "C"
  material: BARRIER
  click:
    - "[sound] light_click"
    - "[run] list_action_clear_search"
  view-requirement:
    - "[condition] '{list_search}' != ''"

list_view_invitation:
  slot: 52
  priority: 1
  material: CHEST
  view-requirement:
    - "[condition] '{team}' == ''"
  action: "inbox.team_invites"

list_view_create:
  char: "H"
  material: PLAYER_HEAD
  texture: "list.create"
  action: "team_list.create"
  view-requirement:
    - "[condition] '{team}' == ''"


home:
  display: "lang.button_home"
  char: "H"
  material: PLAYER_HEAD
  texture: "core.home"
  action: "home"
  view-requirement:
    - "[condition] '{team}' != ''"

# ----------------------------------------------------
# DEFAULT BUTTONS
# ----------------------------------------------------

# FILTERS
list_view_filter_default:
  char: "F"
  material: HOPPER
  action: "list_action_filter"
  click-sound: "click"

list_view_filter_open:
  char: "F"
  material: OAK_DOOR
  action: "list_action_filter"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_filter}' == 'OPEN_ONLY'"

list_view_filter_online:
  char: "F"
  material: LIME_DYE
  action: "list_action_filter"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_filter}' == 'CURRENTLY_ONLINE'"

list_view_filter_not_full:
  char: "F"
  material: CHEST
  action: "list_action_filter"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_filter}' == 'NOT_FULL'"


# SORT TYPES
list_view_sort_money:
  char: "T"
  material: SUNFLOWER
  action: "list_action_sort_type"
  click-sound: "click"

list_view_sort_score:
  char: "T"
  material: NETHER_STAR
  action: "list_action_sort_type"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_sort_type}' == 'SCORE'"

list_view_sort_level:
  char: "T"
  material: EXPERIENCE_BOTTLE
  action: "list_action_sort_type"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_sort_type}' == 'LEVEL'"

list_view_sort_members:
  char: "T"
  material: PLAYER_HEAD
  action: "list_action_sort_type"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_sort_type}' == 'MEMBERS'"


# SORT ORDER
list_view_sort_asc:
  char: "O"
  material: LEVER
  action: "list_action_sort_order"
  click-sound: "click"

list_view_sort_desc:
  char: "O"
  material: REDSTONE_TORCH
  action: "list_action_sort_order"
  click-sound: "click"
  priority: 10
  view-requirement:
    - "[condition] '{list_sort_order}' == 'DESC'"

no-invitation:
  display: "lang.list_view_no_invitation"
  char: "i"
  material: CHEST
  click-sound: gui.list.invitation
