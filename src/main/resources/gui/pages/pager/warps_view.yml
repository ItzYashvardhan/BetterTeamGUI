main:
  title: "lang.warps_view_title"
  rows: 6
  font-title: false
  font-name: true
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "warps_list"
  buffer:
    render-limit: 28  # 28 slots available in this pattern per page
    margin: 5
    cleanup-margin: 40
  template:
    # ----------------------------------------------------
    # WARP STATE TEMPLATES
    # ----------------------------------------------------
    claimable-warp:
      name: "lang.warps_view_claimable_name"
      lore: [ "lang.warps_view_claimable_lore" ]
      item: GREEN_STAINED_GLASS_PANE
      action: "warps.claim"
      click-sound: gui.warps.claimable-warp

    occupied-warp:
      name: "lang.warps_view_occupied_name"
      lore: [ "lang.warps_view_occupied_lore" ]
      item: PLAYER_HEAD
      texture: warps.occupied
      action: "warps.teleport"
      click-sound: gui.warps.occupied-warp

    locked-warp:
      name: "lang.warps_view_locked_name"
      lore: [ "lang.warps_view_locked_lore" ]
      item: RED_STAINED_GLASS_PANE
      action: "warps.unlock"
      click-sound: gui.warps.locked-warp

# ----------------------------------------------------
# CORE BUTTONS (Mapped to Pattern)
# ----------------------------------------------------
prev_page:
  name: "lang.core_prev_page_name"
  char: "<"
  item: PLAYER_HEAD
  texture: "texture:core.prev_page"
  action: "core_prev_page"

next_page:
  name: "lang.core_next_page_name"
  char: ">"
  item: PLAYER_HEAD
  texture: "texture:core.next_page"
  action: "core_next_page"

# ----------------------------------------------------
# ANVIL MENUS (Move Separate from Layout Engine TODO)
# ----------------------------------------------------
anvil-ui:
  set-warp-name:
    title: "lang.warps_view_anvil_set_name_title"
    label: "lang.warps_view_anvil_label"
    input-item:
      name: "lang.warps_view_anvil_set_name_input_name"
      item: PAPER
      lore: [ "lang.warps_view_anvil_set_name_input_lore" ]
    output-item:
      name: "lang.warps_view_anvil_set_name_output_name"
      item: ANVIL
      lore: [ "lang.warps_view_anvil_set_name_output_lore" ]

  enter-warp-password-to-teleport:
    title: "lang.warps_view_anvil_password_title"
    label: "lang.warps_view_anvil_label"
    input-item:
      name: "lang.warps_view_anvil_password_input_name"
      item: PAPER
      lore: [ "lang.warps_view_anvil_password_input_lore" ]
    output-item:
      name: "lang.warps_view_anvil_password_output_name"
      item: ANVIL
      lore: [ "lang.warps_view_anvil_password_output_lore" ]