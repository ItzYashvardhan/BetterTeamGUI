main:
  title: "lang.warps_view_title"
  rows: 6
  font-title: false
  font-name: true
  font-lore: true
  inherit:
    - "template/border"
#    - "template/pager"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . . < . . > . ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "warps_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    # ----------------------------------------------------
    # WARP STATE TEMPLATES
    # ----------------------------------------------------
    claimable-warp:
      name: "lang.warps_view_claimable_name"
      lore: [ "lang.warps_view_claimable_lore" ]
      material: GREEN_STAINED_GLASS_PANE
      action: "warp.claim"

    occupied-warp:
      name: "lang.warps_view_occupied_name"
      lore: [ "lang.warps_view_occupied_lore" ]
      material: PLAYER_HEAD
      texture: warps.occupied
      action: "warp.teleport"

    locked-warp:
      name: "lang.warps_view_locked_name"
      lore: [ "lang.warps_view_locked_lore" ]
      material: RED_STAINED_GLASS_PANE
      action: "warp.locked"

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"

