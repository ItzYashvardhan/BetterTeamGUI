main:
  title: "lang.setting_view"
  rows: 4
  font-title: false
  font-name: true
  font-lore: true
  inherit:
    - template/background
    - template/nav --R
  pattern:
    - ". . . . . . . . . "
    - ". . C D . T S . ."
    - ". . A I . V N . ."
    - "X . . . . . . R ."

# ----------------------------------------------------
# NAVIGATION BUTTONS
# ----------------------------------------------------
back:
  display: "lang.button_back"
  char: "R"
  material: PLAYER_HEAD
  texture: "core.back"
  click:
    - "[sound] click"
    - "[open]  dashboard_view"

# ----------------------------------------------------
# CORE SETTING BUTTONS
# ----------------------------------------------------
setting_view_color_picker:
  char: "C"
  material: PLAYER_HEAD
  texture: "setting.color-picker"
  action: "setting.color-picker"

setting_view_description:
  char: "D"
  material: PLAYER_HEAD
  texture: "setting.description"
  action: "setting.description"

setting_view_tag:
  char: "T"
  material: NAME_TAG
  action: "setting.tag"

setting_view_status_open:
  char: "S"
  material: PLAYER_HEAD
  texture: "setting.status-open"
  action: "setting.status"

setting_view_status_closed:
  display: "lang.setting_view_status_closed"
  char: "S"
  priority: 10
  material: PLAYER_HEAD
  texture: "setting.status-closed"
  action: "setting.status"
  view-requirement:
    - "[condition] '{team_open}' == 'false'"

setting_view_anchor:
  char: "A"
  material: PLAYER_HEAD
  texture: "setting.anchor"
  action: "setting.anchor"

setting_view_no_anchor:
  display: "lang.setting_view_no_anchor"
  char: "A"
  priority: 10
  material: PLAYER_HEAD
  texture: "setting.no-anchor"
  view-requirement:
    - "[condition] '{team_has_home}' == 'false'"

setting_view_title:
  char: "I"
  material: PLAYER_HEAD
  texture: "setting.title"
  action: "setting.title"

setting_view_pvp:
  char: "V"
  material: IRON_SWORD
  flags: [ HIDE_ATTRIBUTES ]
  action: "setting.pvp"

setting_view_rename:
  char: "N"
  material: ANVIL
  action: "setting.rename"

setting_view_disband:
  char: "X"
  material: PLAYER_HEAD
  texture: setting.disband
  action: "setting.disband"

# ----------------------------------------------------
# ANVIL MENUS (Move to Separate from Layout Engine TODO)
# ----------------------------------------------------
anvil-ui:
  description:
    title: "lang.setting_view_anvil_desc_title"
    label: "lang.setting_view_anvil_label"
    input-item:
      name: "lang.setting_view_anvil_desc_input_name"
      material: PAPER
    output-item:
      name: "lang.setting_view_anvil_desc_output_name"
      material: PAPER
  tag:
    title: "lang.setting_view_anvil_tag_title"
    label: "lang.setting_view_anvil_label"
    input-item:
      name: "lang.setting_view_anvil_tag_input_name"
      material: NAME_TAG
    output-item:
      name: "lang.setting_view_anvil_tag_output_name"
      material: NAME_TAG
  title:
    title: "lang.setting_view_anvil_title_title"
    label: "lang.setting_view_anvil_label"
    input-item:
      name: "lang.setting_view_anvil_title_input_name"
      material: PAPER
    output-item:
      name: "lang.setting_view_anvil_title_output_name"
      material: PAPER
  rename:
    title: "lang.setting_view_anvil_rename_title"
    label: "lang.setting_view_anvil_label"
    input-item:
      name: "lang.setting_view_anvil_rename_input_name"
      material: ANVIL
    output-item:
      name: "lang.setting_view_anvil_rename_output_name"
      material: ANVIL
