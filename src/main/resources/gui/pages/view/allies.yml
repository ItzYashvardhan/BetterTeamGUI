# ===================================================================
# ALLIES VIEW (Dynamic List)
# ===================================================================
main:
  title: "lang.ally_view_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

dynamic_list:
  char: "L"
  populator_id: "allies_list"
  buffer:
    render-limit: 28
  templates:
    ally_view_item:
      material: PLAYER_HEAD
      action: view.team

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"
