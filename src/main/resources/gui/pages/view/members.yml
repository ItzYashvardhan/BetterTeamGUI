# ===================================================================
# MEMBERS VIEWER
# ===================================================================
main:
  title: "lang.team_viewer_members_title"
  rows: 6
  inherit:
    - "template/border"
    - "template/nav"  
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". . < . . . > . ."

dynamic_list:
  char: "L"
  populator_id: "members_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    team_viewer_member_item:
      material: PLAYER_HEAD
      click-sound: gui.team-viewer.member-item

prev_page:
  display: "lang.buttons_prev"
  char: "<"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.prev"
  click:
    - "[sound] prev"
  action: "core_prev_page"

next_page:
  display: "lang.buttons_next"
  char: ">"
  priority: 10
  material: PLAYER_HEAD
  texture: "core.next"
  click:
    - "[sound] next"
  action: "core_next_page"
