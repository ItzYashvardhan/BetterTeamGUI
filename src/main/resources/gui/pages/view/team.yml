main:
  title: "lang.team_viewer_title"
  rows: 3
  inherit:
    - "template/background"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". I . . B M A . ."
    - ". . . . . . . X H"

# Info Item
team_viewer_info_with_description:
  name: "lang.team_viewer_info_name"
  char: "I"
  priority: 10
  view-requirement:
    - "[condition] '{team_description}' != ''"
  lore:
    - "lang.team_viewer_info_desc"
    - " "
    - "lang.team_viewer_info_lore_common"
  material: PLAYER_HEAD
  texture: "team.info"
  click-sound: gui.team-viewer.info

team_viewer_info_without_description:
  name: "lang.team_viewer_info_name"
  char: "I"
  priority: 0
  lore:
    - "lang.team_viewer_info_lore_common"
  material: PLAYER_HEAD
  texture: "team.info"
  click-sound: gui.team-viewer.info

  # ----------------------------------------------------
  # CORE BUTTONS
  # ----------------------------------------------------
team_viewer_balance:
  char: "B"
  material: PLAYER_HEAD
  texture: "team.balance" # Moved Base64 to texture.yml
  click-sound: gui.team-viewer.balance

team_viewer_members:
  char: "M"
  material: PLAYER_HEAD
  texture: "team.members"
  action: view.members

team_viewer_allies:
  char: "A"
  material: PLAYER_HEAD
  texture: "team.allies"
  action: view.allies
