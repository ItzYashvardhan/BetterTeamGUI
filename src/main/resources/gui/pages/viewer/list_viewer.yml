main:
  title: "lang.list_view_title"
  rows: 6
  font-title: false
  font-name: false
  font-lore: true
  inherit:
    - "template/border"
    - "template/nav"
  pattern:
    - ". . . . . . . . ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - ". L L L L L L L ."
    - "S . < F T O > I ."

# ----------------------------------------------------
# DYNAMIC LIST SETTINGS
# ----------------------------------------------------
dynamic_list:
  char: "L"
  populator_id: "teams_list"
  buffer:
    render-limit: 28
    margin: 5
    cleanup-margin: 40
  templates:
    in-team:
      name: "lang.list_view_team_item_name_in_team"
      lore:
        - "lang.list_view_team_item_lore_common"
        - "lang.list_view_team_item_lore_click"
      item: PLAYER_HEAD
      action: "teams.view"

    in-team-has-description:
      name: "lang.list_view_team_item_name_in_team"
      lore:
        - "lang.list_view_team_item_desc"
        - "lang.list_view_team_item_lore_common"
        - "lang.list_view_team_item_lore_click"
      item: PLAYER_HEAD
      action: "teams.view"

    no-team:
      name: "lang.list_view_team_item_name_no_team"
      lore:
        - "lang.list_view_team_item_lore_common"
        - "lang.list_view_team_item_lore_join"
      item: PLAYER_HEAD
      action: "teams.join"

    no-team-has-description:
      name: "lang.list_view_team_item_name_no_team"
      lore:
        - "lang.list_view_team_item_desc"
        - "lang.list_view_team_item_lore_common"
        - "lang.list_view_team_item_lore_join"
      item: PLAYER_HEAD
      action: "teams.join"


