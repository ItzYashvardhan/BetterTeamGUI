team:
  main:
    title: "lang.team_viewer_title"
    rows: 3
    inherit:
      - "template/background"
      - "template/nav"
    pattern:
      - ". . . . . . . . ."
      - ". I . . B M A . ."
      - ". . . . . . . X H"

  # ----------------------------------------------------
  # CONDITIONAL INFO BUTTON (Mapped to 'I')
  # ----------------------------------------------------
  info-with-description:
    name: "lang.team_viewer_info_name"
    char: "I"
    priority: 10
    view-requirement:
      - "[condition] team_has_description" # Change this to your actual condition placeholder
    lore:
      - "lang.team_viewer_info_desc"
      - " "
      - "lang.team_viewer_info_lore_common"
    item: PLAYER_HEAD
    texture: "team.info" # Moved Base64 to texture.yml
    click-sound: gui.team-viewer.info

  info-without-description:
    name: "lang.team_viewer_info_name"
    char: "I"
    priority: 0 # Fallback if they have no description
    lore:
      - "lang.team_viewer_info_lore_common"
    item: PLAYER_HEAD
    texture: "team.info" # Moved Base64 to texture.yml
    click-sound: gui.team-viewer.info

  # ----------------------------------------------------
  # CORE BUTTONS
  # ----------------------------------------------------
  balance:
    name: "lang.team_viewer_balance_name"
    char: "B"
    lore:
      - "lang.team_viewer_balance_lore"
    item: PLAYER_HEAD
    texture: "team.balance" # Moved Base64 to texture.yml
    click-sound: gui.team-viewer.balance

  members:
    name: "lang.team_viewer_members_name"
    char: "M"
    lore:
      - "lang.team_viewer_members_lore"
    item: PLAYER_HEAD
    texture: "team.members" # Moved Base64 to texture.yml
    click-sound: gui.team-viewer.members

  allies:
    name: "lang.team_viewer_allies_name"
    char: "A"
    lore:
      - "lang.team_viewer_allies_lore"
    item: PLAYER_HEAD
    texture: "team.allies" # Moved Base64 to texture.yml
    click-sound: gui.team-viewer.allies

# ===================================================================
# MEMBERS VIEWER (Dynamic List)
# ===================================================================
members:
  main:
    title: "lang.team_viewer_members_title"
    rows: 6
    inherit:
      - "template/border"
      - "template/nav"
    pattern:
      - ". . . . . . . . ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". . < . . . > X H"

  dynamic_list:
    char: "L"
    populator_id: "team_members_list"
    buffer:
      render-limit: 28
      margin: 5
      cleanup-margin: 40
    template:
      item: PLAYER_HEAD
      name: "lang.team_viewer_member_item_name"
      lore:
        - "lang.team_viewer_member_item_lore"
      click-sound: gui.team-viewer.member-item

  # Prevents severe warning from validateDynamicNavigation
  prev_page:
    char: "<"
    action: "core_prev_page"

  next_page:
    char: ">"
    action: "core_next_page"

# ===================================================================
# ALLIES VIEWER (Dynamic List)
# ===================================================================
allies:
  main:
    title: "lang.team_viewer_allies_title"
    rows: 6
    inherit:
      - "template/border"
      - "template/nav"
    pattern:
      - ". . . . . . . . ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". L L L L L L L ."
      - ". . < . . . > X H"

  dynamic_list:
    char: "L"
    populator_id: "team_allies_list"
    buffer:
      render-limit: 28
    template:
      name: "lang.team_viewer_ally_item_name"
      lore:
        - "lang.team_viewer_ally_item_lore"
      item: PLAYER_HEAD
      texture: "team.allies" # Moved Base64 to texture.yml
      click-sound: gui.team-viewer.ally-item

  # Prevents severe warning from validateDynamicNavigation
  prev_page:
    char: "<"
    action: "core_prev_page"

  next_page:
    char: ">"
    action: "core_next_page"