claimable-warp:
  item: GREEN_STAINED_GLASS_PANE
  name: "<b><green>Create Warp</green></b>"
  lore:
    - "<gray>Click to set new warp at current location.</gray>"
    - ""
    - "<yellow>Left-Click</yellow> <gray>to claim</gray>"

occupied-warp:
  name: "<b><gradient:#FFDAB4:#FFD2D2>{warp}</gradient></b>"
  item: PLAYER_HEAD
  texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzhiZThhYmQ2NmQwOWE1OGNlMTJkMzc3NTQ0ZDcyNmQyNWNhZDdlOTc5ZThjMjQ4MTg2NmJlOTRkM2IzMmYifX19
  lore:
    - "<gray>Teleport to <gradient:#FFDAB4:#FFD2D2>{warp}</gradient> warp.</gray>"
    - ""
    - "<yellow>Left-Click</yellow> <gray>to teleport</gray>"
    - "<yellow>Shift-Click</yellow> <gray>to delete warp</gray>"
##red glass it will unlock when required {level} is reached
locked-warp:
  item: RED_STAINED_GLASS_PANE
  name: "<b><red>Locked</red></b>"
  lore:
    - "<gray>You need <yellow>Team Level {level}</yellow> to unlock this warp.</gray>"



no-permission:
  name: "<red>No Permission</red>"
  item: BARRIER
  lore:
    - "<gray>You don't have permission to set new warp.</gray>"

anvil-ui:
  set-warp-name:
    title: "<bold>Set Warp Name</bold>"
    label: "<gradient:#00FFC7:#00BC92>➞ </gradient>"
    input-item:
      name: "<green>Enter Warp Name</green>"
      item: PAPER
      lore:
        - "<gray>Enter the name for your new warp.</gray>"
        - "<gray>Optional: Add password after name</gray>"
        - " "
        - "<yellow>Syntax"
        - "<white><warp name> [password]"
    output-item:
      name: "<green>Create New Warp</green>"
      item: ANVIL
      lore:
        - "<gray>Click to confirm the new warp</gray>"
        - "<gray>name with/without password.</gray>"

  enter-warp-password-to-teleport:
    title: "<bold>Enter Password</bold>"
    label: "<gradient:#00FFC7:#00BC92>➞ </gradient>"
    input-item:
      name: "<green>Enter Warp Password</green>"
      item: PAPER
      lore:
        - "<gray>Enter the password to teleport to this warp.</gray>"
    output-item:
      name: "<green>Confirm Warp Password</green>"
      item: ANVIL
      lore:
        - "<gray>Click to confirm the warp password.</gray>"


