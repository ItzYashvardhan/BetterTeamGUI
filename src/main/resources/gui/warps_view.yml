anvil-ui:
  set-warp-name:
    title: "<bold>Set Warp Name</bold>"
    label: "<gray>Enter warp name</gray>"
    input-item:
      name: "<green>Enter Warp Name</green>"
      item: PAPER
      lore:
        - "<gray>Enter the name for your new warp.</gray>"
    output-item:
      name: "<green>Confirm Warp Name</green>"
      item: ANVIL
      lore:
        - "<gray>Click to confirm the warp name.</gray>"

  enter-warp-password:
    title: "<bold>Enter Warp Password</bold>"
    label: "<gray>Enter warp password</gray>"
    input-item:
      name: "<green>Enter Warp Password</green>"
      item: PAPER
      lore:
        - "<gray>Enter the password for your new warp.</gray>"
    output-item:
      name: "<green>Confirm Warp Password</green>"
      item: ANVIL
      lore:
        - "<gray>Click to confirm the warp password.</gray>"

  enter-warp-password-to-teleport:
    title: "<bold>Enter Warp Password</bold>"
    label: "<gray>Enter warp password</gray>"
    input-item:
      name: "<green>Enter Warp Password</green>"
      item: PAPER/
      lore:
        - "<gray>Enter the password to teleport to this warp.</gray>"
    output-item:
