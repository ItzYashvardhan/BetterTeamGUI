# Member Management View
main:
  title: "<bold><gradient:#C45700:#FF7608>Managing: {player}</bold>"
  row: 3
  font-title: false
  font-name: true
  font-lore: true
  background:
    0:
      name: " "
      item: LIGHT_BLUE_STAINED_GLASS_PANE
      slot: [ 0,2,4,6,8,14,18,20,22,24,26 ]
    1:
      name: " "
      item: PURPLE_STAINED_GLASS_PANE
      slot: [ 1,3,5,7,9,11,17,19,21,23,25 ]
    2:
      name: " "
      item: RED_STAINED_GLASS_PANE
      slot: [ 10,12,13,15,16 ]
  slot:
    back: 25
    home: 26

player-info:
  item: PLAYER_HEAD
  name: "<b><aqua>{team_player}</b>"
  lore:
    - "<gray>Rank: <yellow>{rank}</yellow>"
  texture: "[{team_player_uuid}]"
  slot: 10

